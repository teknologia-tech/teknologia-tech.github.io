
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Verifikasi Keamanan | POS KasirKu</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 16px;
  background: #edf5f2;
  font-family: system-ui, sans-serif;
  color: #173e36;
}
main {
  width: 100%;
  max-width: 440px;
  padding: 24px;
  background: white;
  border-radius: 24px;
  box-shadow: 0 12px 40px #173e3615;
  text-align: center;
}
.logo {
  width: 68px;
  height: 68px;
  margin: 0 auto;
  background: #087c66;
  border-radius: 20px;
  display: grid;
  place-items: center;
}
h1 { font-size: 26px; margin-bottom: 4px; }
h2 { font-size: 20px; }
p { color: #64748b; line-height: 1.6; }
.brand {
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: bold;
}
.language {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  margin-bottom: 15px;
}
button {
  border: 1px solid #d1ded9;
  border-radius: 10px;
  background: white;
  padding: 9px 14px;
  cursor: pointer;
}
button:disabled {
  opacity: .5;
  cursor: not-allowed;
}
#retry, #verify {
  width: 100%;
  padding: 14px;
  font-weight: bold;
  margin-top: 8px;
}
#verify {
  background: #087c66;
  color: white;
  border: 0;
}
#retry {
  color: #087c66;
}
#widget { margin: 24px 0; }
#status {
  padding: 12px;
  border-radius: 12px;
  background: #f0f5f3;
  font-size: 14px;
  margin-bottom: 16px;
}
#status.success {
  color: #087c66;
  background: #e0f5e9;
}
#status.error {
  color: #b91c1c;
  background: #fef2f2;
}
footer {
  font-size: 12px;
  color: #64748b;
  margin-top: 25px;
}
</style>
</head>

<body>
<main>
  <div class="language">
    <button id="lang-id" type="button">ID</button>
    <button id="lang-en" type="button">EN</button>
  </div>

  <div class="logo">
    <svg width="38" height="38"
         viewBox="0 0 24 24"
         fill="none"
         stroke="white"
         stroke-width="1.8"
         aria-hidden="true">
      <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/>
      <path d="m8 12 3 3 5-6"/>
    </svg>
  </div>

  <h1>POS KasirKu</h1>
  <div class="brand">TEKNOLOGIA TECH</div>

  <h2 id="heading">Verifikasi Keamanan</h2>
  <p id="description"></p>

  <div id="widget"></div>

  <div id="status" role="status"
       aria-live="polite">
    Memuat verifikasi...
  </div>

  <button id="verify" type="button" disabled>
    Uji autentikasi server
  </button>

  <button id="retry" type="button">
    Ulangi verifikasi
  </button>

  <footer>
    © 2026 Teknologia Tech
    <br>
    Security Test — v2.35.3-beta.5
  </footer>
</main>

<script type="module">
import { createClient } from
"https://esm.sh/@supabase/supabase-js@2";

const SITE_KEY =
  "0x4AAAAAAGVklbjRU9m5_3Gk";

const SUPABASE_URL =
  "https://owemxpqdsivckapdijlw.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_SkLHCYyHk6xi64DSNoS-YQ_I-SEwNlt";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: false,
      autoRefreshToken: false,
      detectSessionInUrl: false
    }
  }
);

const messages = {
  id: {
    title: "Verifikasi Keamanan",
    desc: "Selesaikan CAPTCHA, kemudian uji autentikasi server.",
    loading: "Memuat verifikasi...",
    ready: "Silakan selesaikan pemeriksaan keamanan.",
    captcha: "CAPTCHA berhasil. Silakan uji autentikasi server.",
    processing: "Memvalidasi token melalui Supabase...",
    success: "Autentikasi Supabase dan validasi JWT berhasil.",
    expired: "Verifikasi kedaluwarsa. Silakan ulangi.",
    error: "Verifikasi gagal. Silakan coba kembali.",
    verify: "Uji autentikasi server",
    retry: "Ulangi verifikasi"
  },
  en: {
    title: "Security Verification",
    desc: "Complete CAPTCHA, then test server authentication.",
    loading: "Loading verification...",
    ready: "Please complete the security check.",
    captcha: "CAPTCHA completed. Test server authentication.",
    processing: "Validating token through Supabase...",
    success: "Supabase authentication and JWT validation successful.",
    expired: "Verification expired. Please try again.",
    error: "Verification failed. Please try again.",
    verify: "Test server authentication",
    retry: "Retry verification"
  }
};

const verifyButton = document.getElementById("verify");
const retryButton = document.getElementById("retry");

let language =
  navigator.language.startsWith("id") ? "id" : "en";

let widgetId = null;
let captchaToken = null;
let currentState = "loading";
let busy = false;
let completed = false;
let errorCode = "";

function setStatus(state, code = "") {
  currentState = state;
  errorCode = code;

  const el = document.getElementById("status");

  el.textContent =
    messages[language][state] +
    (code ? " (" + code + ")" : "");

  el.className =
    state === "success" || state === "captcha"
      ? "success"
      : state === "error"
        ? "error"
        : "";
}

function updateControls() {
  verifyButton.disabled =
    busy || completed || !captchaToken;

  retryButton.disabled = busy || completed;

  document.getElementById("lang-id").disabled = busy;
  document.getElementById("lang-en").disabled = busy;
}

function renderWidget() {
  if (!window.turnstile || completed || busy) return;

  captchaToken = null;
  updateControls();

  if (widgetId !== null) {
    turnstile.remove(widgetId);
  }

  setStatus("ready");

  widgetId = turnstile.render("#widget", {
    sitekey: SITE_KEY,
    theme: "light",
    size: "flexible",
    language: language,

    callback: function(token) {
      captchaToken = token;
      setStatus("captcha");
      updateControls();
    },

    "expired-callback": function() {
      captchaToken = null;
      if (!completed && !busy) {
        setStatus("expired");
        updateControls();
      }
    },

    "error-callback": function() {
      captchaToken = null;
      if (!completed && !busy) {
        setStatus("error");
        updateControls();
      }
    }
  });
}

function setLanguage(value) {
  language = value;
  document.documentElement.lang = value;

  document.getElementById("heading").textContent =
    messages[value].title;

  document.getElementById("description").textContent =
    messages[value].desc;

  verifyButton.textContent = messages[value].verify;
  retryButton.textContent = messages[value].retry;

  setStatus(currentState, errorCode);

  if (window.turnstile && !completed && !busy) {
    renderWidget();
  }
}

async function verifyAuthentication() {
  if (busy || completed || !captchaToken) return;

  busy = true;

  const token = captchaToken;
  captchaToken = null;

  updateControls();
  setStatus("processing");

  try {
    const { data, error } =
      await supabase.auth.signInAnonymously({
        options: {
          captchaToken: token
        }
      });

    if (error) {
      const safeCode =
        /^[a-z0-9_]{1,80}$/i.test(error.code || "")
          ? error.code
          : "AUTH_FAILED";

      setStatus("error", safeCode);
      return;
    }

    if (
      !data.session ||
      !data.user ||
      data.user.is_anonymous !== true
    ) {
      setStatus("error", "INVALID_SESSION");
      return;
    }

    
const { data: apiResult, error: apiError } =
  await supabase.functions.invoke(
    "reviewer-access",
    {
      body: {
        action: "session-check"
      },
      headers: {
        Authorization:
          "Bearer " + data.session.access_token
      }
    }
  );

if (
  apiError ||
  !apiResult ||
  apiResult.success !== true ||
  apiResult.code !== "SESSION_VALIDATED" ||
  apiResult.anonymous_session !== true ||
  apiResult.version !== "2.35.3-beta.5" ||
  apiResult.entitlement_issued !== false
) {
  await supabase.auth.signOut({ scope: "local" });
  setStatus("error", "JWT_VALIDATION_FAILED");
  return;
}


const testResults = [];

for (let i = 1; i <= 6; i++) {
  const response = await fetch(
    SUPABASE_URL + "/functions/v1/reviewer-access",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_PUBLISHABLE_KEY,
        "Authorization":
          "Bearer " + data.session.access_token
      },
      body: JSON.stringify({
        action: "authenticate",
        access_code: "00000000000000000000000000000000"
      })
    }
  );

  const result = await response.json();

  const expected =
    i <= 5
      ? "INVALID_CREDENTIALS"
      : "RATE_LIMITED";

  const expectedStatus = i <= 5 ? 401 : 429;

  if (
    result.success !== false ||
    result.code !== expected ||
    response.status !== expectedStatus
  ) {
    await supabase.auth.signOut({ scope: "local" });
    setStatus("error", "RATE_LIMIT_TEST_FAILED_" + i);
    return;
  }

  testResults.push(response.status);
}

completed = true;

setStatus(
  "success",
  "RATE_LIMIT_VALIDATED: " + testResults.join(", ")
);



    // End temporary browser session.
    // Do not publish or log authentication tokens.
    await supabase.auth.signOut({ scope: "local" });

  } catch {
    if (!completed) {
      setStatus("error", "CONNECTION_FAILED");
    }
  } finally {
    busy = false;
    updateControls();
  }
}

verifyButton.onclick = verifyAuthentication;

retryButton.onclick = () => {
  if (busy || completed) return;

  captchaToken = null;

  if (window.turnstile) {
    renderWidget();
  } else {
    location.reload();
  }
};

document.getElementById("lang-id").onclick =
  () => setLanguage("id");

document.getElementById("lang-en").onclick =
  () => setLanguage("en");

window.onTurnstileLoaded = renderWidget;

setLanguage(language);
updateControls();

const script = document.createElement("script");

script.src =
  "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoaded";

script.async = true;
script.onerror = () => setStatus("error");

document.head.appendChild(script);
</script>
</body>
</html>
