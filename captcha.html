
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Verifikasi Keamanan | POS KasirKu</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 16px;
  background: #edf5f2;
  font-family: system-ui, sans-serif;
  color: #173e36;
}
main {
  width: 100%;
  max-width: 440px;
  padding: 24px;
  background: white;
  border-radius: 24px;
  box-shadow: 0 12px 40px #173e3615;
  text-align: center;
}
.logo {
  width: 68px;
  height: 68px;
  margin: 0 auto;
  background: #087c66;
  border-radius: 20px;
  display: grid;
  place-items: center;
}
h1 { font-size: 26px; margin-bottom: 4px; }
h2 { font-size: 20px; }
p { color: #64748b; line-height: 1.6; }
.brand {
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: bold;
}
.language {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  margin-bottom: 15px;
}
button {
  border: 1px solid #d1ded9;
  border-radius: 10px;
  background: white;
  padding: 9px 14px;
  cursor: pointer;
}
button:disabled {
  opacity: .5;
  cursor: not-allowed;
}
#retry, #verify {
  width: 100%;
  padding: 14px;
  font-weight: bold;
  margin-top: 8px;
}
#verify {
  background: #087c66;
  color: white;
  border: 0;
}
#retry {
  color: #087c66;
}
#widget { margin: 24px 0; }
#status {
  padding: 12px;
  border-radius: 12px;
  background: #f0f5f3;
  font-size: 14px;
  margin-bottom: 16px;
}
#status.success {
  color: #087c66;
  background: #e0f5e9;
}
#status.error {
  color: #b91c1c;
  background: #fef2f2;
}
footer {
  font-size: 12px;
  color: #64748b;
  margin-top: 25px;
}
</style>
</head>

<body>
<main>
  <div class="language">
    <button id="lang-id" type="button">ID</button>
    <button id="lang-en" type="button">EN</button>
  </div>

  <div class="logo">
    <svg width="38" height="38"
         viewBox="0 0 24 24"
         fill="none"
         stroke="white"
         stroke-width="1.8"
         aria-hidden="true">
      <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/>
      <path d="m8 12 3 3 5-6"/>
    </svg>
  </div>

  <h1>POS KasirKu</h1>
  <div class="brand">TEKNOLOGIA TECH</div>

  <h2 id="heading">Verifikasi Keamanan</h2>
  <p id="description"></p>

  <div id="widget"></div>

  <div id="status" role="status"
       aria-live="polite">
    Memuat verifikasi...
  </div>

  <label for="test-code" id="code-label">Kode pengujian sementara</label>
  <input id="test-code" type="password" maxlength="32" autocomplete="off" spellcheck="false" style="width:100%;padding:12px;border:1px solid #d1ded9;border-radius:10px;margin:8px 0" />
  <button id="verify" type="button" disabled>
    Uji lisensi staging
  </button>

  <button id="retry" type="button">
    Ulangi verifikasi
  </button>

  <footer>
    © 2026 Teknologia Tech
    <br>
    License Staging Test — v2.35.4.4
  </footer>
</main>

<script type="module">
import { createClient } from
"https://esm.sh/@supabase/supabase-js@2";

const SITE_KEY =
  "0x4AAAAAAGVklbjRU9m5_3Gk";

const SUPABASE_URL =
  "https://owemxpqdsivckapdijlw.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_SkLHCYyHk6xi64DSNoS-YQ_I-SEwNlt";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: false,
      autoRefreshToken: false,
      detectSessionInUrl: false
    }
  }
);

const messages = {
  id: {
    title: "Verifikasi Keamanan",
    desc: "Masukkan kode pengujian sementara, selesaikan CAPTCHA, lalu uji lisensi staging.",
    loading: "Memuat verifikasi...",
    ready: "Silakan selesaikan pemeriksaan keamanan.",
    captcha: "CAPTCHA berhasil. Silakan uji autentikasi server.",
    processing: "Memvalidasi token melalui Supabase...",
    success: "Seluruh pemeriksaan lisensi staging berhasil.",
    expired: "Verifikasi kedaluwarsa. Silakan ulangi.",
    error: "Verifikasi gagal. Silakan coba kembali.",
    verify: "Uji lisensi staging",
    retry: "Ulangi verifikasi"
  },
  en: {
    title: "Security Verification",
    desc: "Enter the temporary test code, complete CAPTCHA, then test the staging license.",
    loading: "Loading verification...",
    ready: "Please complete the security check.",
    captcha: "CAPTCHA completed. Test staging license.",
    processing: "Validating token through Supabase...",
    success: "All staging license checks passed.",
    expired: "Verification expired. Please try again.",
    error: "Verification failed. Please try again.",
    verify: "Test staging license",
    retry: "Retry verification"
  }
};

const verifyButton = document.getElementById("verify");
const retryButton = document.getElementById("retry");
const codeInput = document.getElementById("test-code");
codeInput.addEventListener("input", updateControls);

let language =
  navigator.language.startsWith("id") ? "id" : "en";

let widgetId = null;
let captchaToken = null;
let currentState = "loading";
let busy = false;
let completed = false;
let errorCode = "";

function setStatus(state, code = "") {
  currentState = state;
  errorCode = code;

  const el = document.getElementById("status");

  el.textContent =
    messages[language][state] +
    (code ? " (" + code + ")" : "");

  el.className =
    state === "success" || state === "captcha"
      ? "success"
      : state === "error"
        ? "error"
        : "";
}

function updateControls() {
  verifyButton.disabled =
    busy || completed || !captchaToken || !/^[0-9a-f]{32}$/i.test(codeInput.value.trim());
  codeInput.disabled = busy || completed;

  retryButton.disabled = busy || completed;

  document.getElementById("lang-id").disabled = busy;
  document.getElementById("lang-en").disabled = busy;
}

function renderWidget() {
  if (!window.turnstile || completed || busy) return;

  captchaToken = null;
  updateControls();

  if (widgetId !== null) {
    turnstile.remove(widgetId);
  }

  setStatus("ready");

  widgetId = turnstile.render("#widget", {
    sitekey: SITE_KEY,
    theme: "light",
    size: "flexible",
    language: language,

    callback: function(token) {
      captchaToken = token;
      setStatus("captcha");
      updateControls();
    },

    "expired-callback": function() {
      captchaToken = null;
      if (!completed && !busy) {
        setStatus("expired");
        updateControls();
      }
    },

    "error-callback": function() {
      captchaToken = null;
      if (!completed && !busy) {
        setStatus("error");
        updateControls();
      }
    }
  });
}

function setLanguage(value) {
  language = value;
  document.getElementById("code-label").textContent = value === "id" ? "Kode pengujian sementara" : "Temporary test code";
  document.documentElement.lang = value;

  document.getElementById("heading").textContent =
    messages[value].title;

  document.getElementById("description").textContent =
    messages[value].desc;

  verifyButton.textContent = messages[value].verify;
  retryButton.textContent = messages[value].retry;

  setStatus(currentState, errorCode);

  if (window.turnstile && !completed && !busy) {
    renderWidget();
  }
}

const PUBLIC_KEY = "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEgINfY87GZ7cSAMURlCE91k4iFuXbeaQOyneh9giEjOmXxsJvbDm/r0wMV/F5Q/guJneVRsXgIipqmIMJv1HiNA==";
const encoder = new TextEncoder();
const decoder = new TextDecoder();
function decode64(s) {
  return Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/").padEnd(Math.ceil(s.length/4)*4,"=")), c=>c.charCodeAt(0));
}
function encode64(b) {
  return btoa(String.fromCharCode(...b)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"");
}
async function checkLicense(token, installation, now, key) {
  try {
    const parts = token.split(".");
    if (parts.length !== 3) return false;
    const [h,p,s] = parts;
    const header = JSON.parse(decoder.decode(decode64(h)));
    const claims = JSON.parse(decoder.decode(decode64(p)));
    const signature = decode64(s);
    if (header.alg !== "ES256" || header.typ !== "kasirku-staging+jws" || header.kid !== "kasirku-license-v1" || signature.length !== 64) return false;
    if (!await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,signature,encoder.encode(h+"."+p))) return false;
    return claims.iss === "pos-kasirku-staging" && claims.aud === "com.teknologiatech.kasirku" && claims.test === true && claims.entitlement === "reviewer" && claims.sub === installation && claims.installation_hash === installation && typeof claims.jti === "string" && typeof claims.entitlement_id === "string" && Number.isSafeInteger(claims.iat) && Number.isSafeInteger(claims.exp) && claims.iat <= now+60 && now < claims.exp && claims.exp-claims.iat === 2592000;
  } catch { return false; }
}
async function verifyAuthentication() {
  if (busy || completed || !captchaToken || !/^[0-9a-f]{32}$/i.test(codeInput.value.trim())) return;
  busy = true;
  const token = captchaToken;
  const accessCode = codeInput.value.trim();
  codeInput.value = "";
  captchaToken = null;
  updateControls();
  setStatus("processing");
  try {
    const {data,error} = await supabase.auth.signInAnonymously({options:{captchaToken:token}});
    if (error || !data.session || data.user?.is_anonymous !== true) throw Error("AUTH_FAILED");
    const installation = Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,"0")).join("");
    const response = await fetch(SUPABASE_URL+"/functions/v1/reviewer-access", {
      method:"POST", headers:{"Content-Type":"application/json",apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:"Bearer "+data.session.access_token},
      body:JSON.stringify({action:"issue-license",access_code:accessCode,installation_hash:installation})
    });
    const result = await response.json();
    if (!response.ok || result.success !== true || result.code !== "TEST_LICENSE_ISSUED" || result.version !== "2.35.4.3" || result.test !== true || result.entitlement_issued !== true || typeof result.license !== "string") {
      throw Error("ISSUE_FAILED_HTTP_"+response.status+(typeof result.code === "string" && /^[A-Z0-9_]{1,80}$/.test(result.code)?"_"+result.code:""));
    }
    const key = await crypto.subtle.importKey("spki",decode64(PUBLIC_KEY),{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
    const now = Math.floor(Date.now()/1000);
    const [h,p,s] = result.license.split(".");
    const claims = JSON.parse(decoder.decode(decode64(p)));
    const changed = encode64(encoder.encode(JSON.stringify({...claims,entitlement:"premium"})));
    const fake = decode64(s); fake[0] ^= 1;
    const other = (installation[0] === "0" ? "1" : "0") + installation.slice(1);
    const checks = [
      await checkLicense(result.license,installation,now,key),
      !await checkLicense(h+"."+changed+"."+s,installation,now,key),
      !await checkLicense(h+"."+p+"."+encode64(fake),installation,now,key),
      !await checkLicense(result.license,other,now,key),
      !await checkLicense(result.license,installation,claims.exp,key)
    ];
    if (!checks.every(Boolean)) throw Error("LICENSE_CHECK_FAILED_"+checks.map(x=>x?"PASS":"FAIL").join("_"));
    completed = true;
    setStatus("success","LICENSE_TEST_PASSED: 5/5");
  } catch(e) {
    const msg = e instanceof Error ? e.message : "";
    setStatus("error", /^[A-Z0-9_]{1,140}$/.test(msg)?msg:"TEST_FAILED");
  } finally {
    try { await supabase.auth.signOut({scope:"local"}); } catch {}
    busy = false;
    updateControls();
  }
}

verifyButton.onclick = verifyAuthentication;

retryButton.onclick = () => {
  if (busy || completed) return;

  captchaToken = null;

  if (window.turnstile) {
    renderWidget();
  } else {
    location.reload();
  }
};

document.getElementById("lang-id").onclick =
  () => setLanguage("id");

document.getElementById("lang-en").onclick =
  () => setLanguage("en");

window.onTurnstileLoaded = renderWidget;

setLanguage(language);
updateControls();

const script = document.createElement("script");

script.src =
  "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoaded";

script.async = true;
script.onerror = () => setStatus("error");

document.head.appendChild(script);
</script>
</body>
</html>
